name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # composite.smoke, composite-brand-font and render-variant render through
      # real satori, so they read the vendored faces off disk. The directory is
      # gitignored (no binaries in the repo), so without this step those three
      # fall through to fonts.googleapis.com and the suite depends on Google
      # being up — the flake KOS-V1-BUG-010 exists to remove.
      - name: Vendor render fonts
        run: pnpm fonts

      - name: Test
        run: pnpm test

      # Non-blocking: surfaces high/critical advisories without failing merges on transitive noise.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
