allowBuilds:
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@posthog/core@1.40.2'
  - posthog-js@1.399.2
  - posthog-node@5.41.0
  # Browser-support data package (frequent releases); pulled in by the merged
  # Dependabot bump. Not a vulnerability — accept it past the release-age gate.
  - baseline-browser-mapping@2.11.4
# Security overrides: pin patched versions of transitive deps flagged by
# Dependabot. The floor is the PATCHED version, not the range that merely
# allows it — a permissive floor leaves the old resolution sitting in the
# lockfile and the alert open, which is how sharp/js-yaml/hono stayed
# vulnerable while looking overridden.
overrides:
  sharp: ^0.35.4
  postcss: ^8.5.18
  dompurify: ^3.4.12
  js-yaml: ^4.3.2
  hono: ^4.13.5
  fast-uri: ^3.1.7
  # 5.0.8 patched GHSA-mh99-v99m-4gvg and 5.0.12 patches the quadratic-time
  # `{a},b}` expansion (CPU DoS). No 1.x fix exists for either; 5.x is a dual
  # CJS/ESM package so the old minimatch@3 consumer can still require() it.
  # ^5.0.8 ALLOWED 5.0.9 and that is what the lockfile resolved, which is the
  # permissive-floor mistake this block's own comment warns about.
  brace-expansion: ^5.0.12
  # AI SDK provider-utils pins undici@5, which carries 11 open advisories
  # (WebSocket DoS, CRLF injection, request smuggling); all fixed in 6.28+.
  undici: ^6.28.0
  # 0.28.1 patches the Windows dev-server file-read advisory; also lifts the
  # esbuild@0.18 bundled inside drizzle-kit past its dev-server CORS advisory.
  esbuild: '>=0.28.1'
